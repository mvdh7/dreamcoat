name: Run tests
on:
  push:
    paths:
      - .github/workflows/tests.yml
      - dreamcoat/**
      - tests/**
jobs:
  build:
    name: Build package and run tests
    strategy:
      matrix:
        python-version: ["3.14"]
        os: ["ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Set up pixi and run tests
      run: |
        curl -fsSL https://pixi.sh/install.sh | sh
        export PATH="$HOME/.pixi/bin:$PATH"
        pixi install
        pixi run pytest
